services:
  tabshare:
    build:
      context: ..
      dockerfile: deploy/Dockerfile
    command: ["-public-url", "https://${TABSHARE_DOMAIN:?Set your public hostname}"]
    environment:
      TABSHARE_TURN_LISTEN: ${TABSHARE_TURN_LISTEN-0.0.0.0:3478}
      TABSHARE_TURN_PUBLIC_IP: ${TABSHARE_TURN_PUBLIC_IP:-}
    ports:
      - "3478:3478/tcp"
      - "3478:3478/udp"
      - "49160-49359:49160-49359/udp"
    volumes: ["sessions:/data"]
    restart: unless-stopped
  caddy:
    image: caddy:2.10-alpine
    environment:
      TABSHARE_DOMAIN: ${TABSHARE_DOMAIN:?Set your public hostname}
    ports: ["80:80", "443:443"]
    volumes: ["./Caddyfile:/etc/caddy/Caddyfile:ro", "caddy-data:/data", "caddy-config:/config"]
    restart: unless-stopped
    depends_on: [tabshare]
volumes:
  sessions:
  caddy-data:
  caddy-config:
