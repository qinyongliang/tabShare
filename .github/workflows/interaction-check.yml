name: Verify interaction and display modes
on:
  push:
    branches: [perf/interaction-modes]
permissions:
  contents: read
jobs:
  verify:
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v6
        with:
          go-version: '1.27.2'
      - uses: actions/setup-node@v4
        with:
          node-version: '24'
      - name: Install Chinese screenshot fonts
        run: sudo apt-get update -qq && sudo apt-get install -y fonts-noto-cjk
      - run: npm ci --ignore-scripts
      - run: go test -race ./...
      - run: go vet ./...
      - run: npm test
      - name: Browser regression and interaction scenarios
        run: |
          export CHROMIUM_PATH=$(command -v google-chrome)
          npm run test:optimizations
          npm run test:feedback
          TEST_RTC=0 npm run test:e2e
          TEST_TURN=1 npm run test:e2e
          npm run test:transport
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: interaction-evidence
          path: test-results/
          retention-days: 7
