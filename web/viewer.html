<!doctype html><html lang="zh-CN"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover, interactive-widget=resizes-content"><title>TabShare · 共享标签页</title><link rel="stylesheet" href="/assets/style.css"></head>
<body class="viewer"><header class="toolbar"><a class="brand" href="/"><span class="mark">TS</span><span>TabShare</span></a><nav><button id="back" aria-label="后退">←</button><button id="forward" aria-label="前进">→</button><button id="reload" aria-label="刷新">↻</button></nav><form id="navigation"><input id="address" aria-label="共享标签页的网址" placeholder="https://…" autocomplete="off"></form><span id="viewers">1 人</span><button id="fullscreen" aria-label="全屏显示共享页面">⛶</button><button id="retry">重新连接</button></header>
<div class="connection"><span id="dot"></span><span id="status" role="status">正在连接共享浏览器…</span><span class="shared-note">所有访客共用一个标签页</span></div>
<main id="stage"><div id="empty"><span class="mark">TS</span><h1>连接到共享标签页</h1><p id="detail">等待浏览器同步页面。</p></div><div id="display-area" hidden><div id="surface" hidden><iframe id="mirror" title="共享标签页的 DOM 页面" src="/assets/mirror.html" sandbox="allow-same-origin"></iframe><video id="stream" autoplay playsinline muted hidden></video><img id="fallback" alt="复杂页面的降级画面" hidden draggable="false"><textarea id="fallback-keyboard" aria-label="降级画面键盘输入"></textarea></div></div></main>
<aside id="share-settings" hidden><h2>共享设置</h2><label><input type="radio" name="share-mode" value="dom" checked> 本地模式（DOM 同步）</label><label><input type="radio" name="share-mode" value="raster"> 远程模式（WebRTC 视频）</label><p>所有访客同步切换。两个模式都优先 P2P 连接，复杂区域使用视频。</p><fieldset><legend>我的显示</legend><label for="display-sizing">显示方式</label><select id="display-sizing"><option value="fit">适应窗口</option><option value="width">适应宽度</option><option value="actual">原始尺寸（100%）</option><option value="custom">自定义缩放</option></select><label for="display-zoom">缩放 <output id="display-percent">100%</output></label><input id="display-zoom" type="range" min="25" max="200" step="5" value="100"><p id="display-info" aria-live="polite"></p></fieldset><fieldset><legend>共享网页布局</legend><label><input id="follow-viewport" type="checkbox"> 按我的窗口自动调整共享视口</label><p id="viewport-note">此项会调整源网页布局，所有访客共同使用。</p><button id="restore-viewport">恢复源浏览器视口</button></fieldset><button id="close-popup">关闭共享网页的弹出页</button></aside><button id="share-settings-toggle" aria-expanded="false" aria-controls="share-settings">TS 共享设置</button>
<dialog id="site-dialog"><form id="dialog-answer"><h2 id="dialog-title">网页提示</h2><p id="dialog-message"></p><input id="dialog-value" aria-label="网页提示输入"><div><button type="button" id="dialog-cancel">取消</button><button type="submit">确定</button></div></form></dialog>
<footer><span>DOM 差异同步 · 可选择文字、复制和操作表单</span><button id="leave">断开访问</button></footer><script type="module" src="/assets/viewer.js"></script></body></html>
