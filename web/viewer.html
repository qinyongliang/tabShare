<!doctype html><html lang="zh-CN" class="viewer-root"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover, interactive-widget=resizes-content"><title>TabShare · 共享标签页</title><link rel="stylesheet" href="/assets/style.css"></head>
<body class="viewer">
<div id="sync-feedback" role="status" aria-live="polite" hidden><span class="sync-spinner" aria-hidden="true"></span></div>
<main id="stage"><div id="empty"><span class="sync-spinner" aria-hidden="true"></span><p id="detail"></p></div><div id="display-area" hidden><div id="surface" hidden><iframe id="mirror" title="共享标签页的 DOM 页面" src="/assets/mirror.html" sandbox="allow-same-origin"></iframe><video id="stream" autoplay playsinline muted hidden></video><img id="fallback" alt="复杂页面的降级画面" hidden draggable="false"><textarea id="fallback-keyboard" aria-label="降级画面键盘输入"></textarea></div></div></main>
<aside id="share-settings" hidden aria-label="共享控制面板">
<header class="settings-header"><h2>TabShare</h2><span id="viewers">1 人</span><button id="close-settings" aria-label="收起面板">×</button></header>
<div class="connection"><span id="dot"></span><span id="status" role="status">连接中…</span></div>
<fieldset class="mode-picker"><legend>画面模式</legend><div class="segmented"><label><input type="radio" name="share-mode" value="dom" checked><span>DOM</span></label><label><input type="radio" name="share-mode" value="raster"><span>WebRTC</span></label></div><p id="render-note">等待共享页面</p></fieldset>
<div class="quick-actions"><button id="reload" aria-label="刷新共享网页">↻ 刷新</button><button id="fullscreen" aria-label="全屏显示共享页面">全屏</button><button id="retry">重新连接</button></div>
<div class="display-row"><label for="display-sizing">显示</label><select id="display-sizing"><option value="fit">适应窗口</option><option value="width">适应宽度</option><option value="actual">原始尺寸</option><option value="custom">自定义缩放</option></select></div>
<details id="advanced-settings"><summary>更多设置</summary><div class="advanced-content">
<label for="display-zoom">缩放 <output id="display-percent">100%</output></label><input id="display-zoom" type="range" min="25" max="200" step="5" value="100"><p id="display-info" aria-live="polite"></p>
<form id="navigation"><label for="address">网页地址</label><input id="address" aria-label="共享标签页的网址" placeholder="https://…" autocomplete="off"></form>
<label class="check-row"><input id="follow-viewport" type="checkbox"> 跟随我的窗口</label><p id="viewport-note">所有访客共用网页布局</p><button id="restore-viewport">恢复源视口</button><button id="close-popup">关闭弹出页</button>
</div></details><div id="shared-pages" aria-label="共享网页打开的新页面"></div><div id="downloads" aria-label="来自共享页的下载"></div>
<footer class="settings-actions"><span>模式切换对所有访客生效</span><button id="leave">断开</button></footer></aside><button id="share-settings-toggle" aria-expanded="false" aria-controls="share-settings" aria-label="共享设置"><span aria-hidden="true">◈</span> 共享</button>
<dialog id="site-dialog"><form id="dialog-answer"><h2 id="dialog-title">网页提示</h2><p id="dialog-message"></p><input id="dialog-value" aria-label="网页提示输入"><div><button type="button" id="dialog-cancel">取消</button><button type="submit">确定</button></div></form></dialog>
<script type="module" src="/assets/viewer.js"></script></body></html>
