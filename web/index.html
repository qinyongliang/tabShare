<!doctype html><html lang="zh-CN"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width, initial-scale=1"><title>TabShare · 共享浏览器标签页</title><link rel="stylesheet" href="/assets/style.css"></head>
<body><main class="landing"><div class="brand"><span class="mark">TS</span>TabShare</div><span class="eyebrow">同一个页面，一起操作</span><h1>一个标签页。<br>共享真实的浏览体验。</h1><p>通过 TabShare 扩展共享标签页，再把生成的链接发送给你的伙伴。点击、输入、滚动和导航，都发生在同一个浏览器标签页。</p><ol><li>在你电脑的 Chrome 中加载 TabShare 扩展。</li><li>在扩展设置中连接你的服务器。</li><li>共享当前标签页，或创建可复用的网址分享。</li><li>打开完整分享链接，即可共同操作。</li></ol><aside>此服务器不会自行打开浏览器。共享浏览器需要保持运行并在线。</aside></main></body></html>
